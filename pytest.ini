# =============================================================================
# PYTEST.INI - Pytest Configuration File
# =============================================================================
# This file contains pytest settings and options.
# Pytest automatically reads this file when it starts.

[pytest]
# Add command line options by default
# -v: Verbose output (shows test names)
# --tb=short: Shorter traceback messages
addopts = -v --tb=short

# Directory where test files are located
testpaths = tests

# Ignore these directories from test collection
norecursedirs = .venv venv __pycache__ .pytest_cache

# Python file pattern for test discovery
python_files = test_*.py

# Python function pattern for test discovery  
python_functions = test_*

# Python class pattern for test discovery
python_classes = Test*
